name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # プロトタイプHTMLの健全性チェック（存在・非空・<title>・プレースホルダ残り）
      - name: Validate prototype HTML
        run: |
          set -e
          fail=0
          for f in index.html offline.html wireframes/core-flow.html wireframes/landing.html wireframes/admin.html wireframes/economy.html; do
            echo "→ $f"
            test -s "$f" || { echo "  ✗ missing or empty"; fail=1; continue; }
            grep -q "<title>" "$f" || { echo "  ✗ no <title>"; fail=1; }
            if grep -nE "lorem|ipsum|TODO|FIXME|\\[insert" "$f"; then echo "  ✗ placeholder text found"; fail=1; fi
          done
          if [ "$fail" = "1" ]; then echo "checks failed"; exit 1; fi
          echo "all good"

      - name: Validate SQL migrations present
        run: |
          set -e
          ls supabase/migrations/0001_core.sql supabase/migrations/0006_functions.sql
          echo "migrations present"

      # setup_all.sql は migrations + seed の生成物。マイグレーションを追加したのに
      # 再生成を忘れると、ブラウザの SQL Editor でセットアップした人だけ
      # スキーマが欠けた状態になる（黙って古くなるのを防ぐ）。
      - name: Check setup_all.sql is up to date
        run: |
          set -e
          cp supabase/setup_all.sql /tmp/setup_all.committed.sql
          bash scripts/build-setup-sql.sh
          if ! diff -q /tmp/setup_all.committed.sql supabase/setup_all.sql; then
            echo "✗ supabase/setup_all.sql が最新ではありません。"
            echo "  bash scripts/build-setup-sql.sh を実行してコミットしてください。"
            diff /tmp/setup_all.committed.sql supabase/setup_all.sql | head -40
            exit 1
          fi
          echo "setup_all.sql is up to date"

  admin-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build

  # 運営コンソールの認証ゲート E2E（Playwright / Chromium）
  admin-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # DB のセキュリティ/経済の不変条件テスト（全マイグレーション+seed を素の Postgres に適用して検証）
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run DB test suite
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run.sh
