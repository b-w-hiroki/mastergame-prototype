<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オフライン ｜ MasterGame</title>
<meta name="theme-color" content="#0c0e16">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;
    font-family:"Noto Sans JP",system-ui,sans-serif;
    background:radial-gradient(80% 100% at 50% -20%,#23264d,#0c0e16 70%)}
  .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 22px;
    background:linear-gradient(140deg,#5563e0,#7c5cff);display:grid;place-items:center;font-weight:800;font-size:24px}
  h1{font-size:22px;margin-bottom:10px}
  p{color:#aeb3c8;font-size:14px;line-height:1.8;margin-bottom:24px;max-width:420px}
  button{background:linear-gradient(120deg,#5563e0,#7c5cff);color:#fff;font-weight:700;font-size:14px;
    border:0;border-radius:999px;padding:12px 24px;cursor:pointer}
</style>
</head>
<body>
  <div>
    <div class="logo">MG</div>
    <h1>オフラインです</h1>
    <p>インターネットに接続できませんでした。電波の良い場所で、もう一度お試しください。一度開いた画面はオフラインでも表示できます。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
