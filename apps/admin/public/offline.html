<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オフライン ｜ MasterGame 運営コンソール</title>
<meta name="theme-color" content="#12152a">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;
    font-family:"Noto Sans JP",system-ui,sans-serif;background:#12152a}
  .logo{width:60px;height:60px;border-radius:16px;margin:0 auto 20px;
    background:linear-gradient(140deg,#5563e0,#7c5cff);display:grid;place-items:center;font-weight:800;font-size:22px}
  h1{font-size:20px;margin-bottom:10px}
  p{color:#aeb3c8;font-size:14px;line-height:1.8;margin-bottom:22px;max-width:380px}
  button{background:linear-gradient(120deg,#5563e0,#7c5cff);color:#fff;font-weight:700;font-size:14px;
    border:0;border-radius:999px;padding:12px 24px;cursor:pointer}
</style>
</head>
<body>
  <div>
    <div class="logo">MG</div>
    <h1>オフラインです</h1>
    <p>運営コンソールはオンライン環境でご利用ください。接続を確認して、もう一度お試しください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
