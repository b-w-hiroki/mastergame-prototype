<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5563e0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- full-bleed background (safe for maskable) -->
  <rect width="512" height="512" fill="#0e1015"/>
  <!-- brand tile -->
  <rect x="116" y="116" width="280" height="280" rx="64" fill="url(#g)" filter="url(#sh)"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="'Plus Jakarta Sans','Noto Sans JP',system-ui,sans-serif"
        font-size="148" font-weight="800" fill="#ffffff" letter-spacing="-6">MG</text>
</svg>
