<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5563e0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- full-bleed gradient: corners may be masked by the OS -->
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- monogram kept inside the ~80% safe zone -->
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="'Plus Jakarta Sans','Noto Sans JP',system-ui,sans-serif"
        font-size="220" font-weight="800" fill="#ffffff" letter-spacing="-8">MG</text>
</svg>
