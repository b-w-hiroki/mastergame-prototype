# Supabase local config — MasterGame
# docs: https://supabase.com/docs/guides/cli/config
project_id = "mastergame"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# NOTE: この config.toml は supabase CLI の **ローカル開発専用**。
# 本番（ホスト型プロジェクト）の Auth 設定は Supabase ダッシュボードで行う。
# 本番では最低限:
#   - site_url / additional_redirect_urls を本番ドメイン・アプリスキームに設定
#   - [auth.email] enable_confirmations = true（メール確認必須。複数アカウント不正の抑止）
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:3000", "mastergame://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# ローカルは確認オフで検証しやすく。本番はダッシュボードで必ずオンにする。
enable_confirmations = false

# OAuth providers (set secrets via env; see .env.example)
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[realtime]
enabled = true
